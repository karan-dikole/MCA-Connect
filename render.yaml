services:
  - type: web
    name: mca-connect-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn mca_connect.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mca-connect-db
          property: connectionString

databases:
  - name: mca-connect-db
    databaseName: mca_connect
    user: mca_user
    plan: free
